name: iPhone app
on: [push, workflow_dispatch]
permissions: { contents: write }
jobs:
  ios:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { ref: gh-pages, path: www/game }
      - run: rm -rf www/game/.git
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install && npx cap add ios
      - name: Landscape, full screen, screen stays on, icon + splash
        run: |
          P=ios/App/App/Info.plist; PB=/usr/libexec/PlistBuddy
          for K in UISupportedInterfaceOrientations "UISupportedInterfaceOrientations~ipad"; do
            $PB -c "Delete :$K" $P || true
            $PB -c "Add :$K array" -c "Add :$K:0 string UIInterfaceOrientationLandscapeRight" -c "Add :$K:1 string UIInterfaceOrientationLandscapeLeft" $P
          done
          for KV in "UIStatusBarHidden bool true" "UIViewControllerBasedStatusBarAppearance bool false" "UIRequiresFullScreen bool true"; do
            set -- $KV; $PB -c "Delete :$1" $P || true; $PB -c "Add :$1 $2 $3" $P
          done
          sed -i '' '/didFinishLaunchingWithOptions/a\
          UIApplication.shared.isIdleTimerDisabled = true
          ' ios/App/App/AppDelegate.swift
          A=ios/App/App/Assets.xcassets
          for F in $A/AppIcon.appiconset/*.png; do sips -z 1024 1024 icon.png --out "$F"; done
          for F in $A/Splash.imageset/*.png; do cp splash.png "$F"; done
      - name: Build (unsigned)
        run: |
          set -o pipefail
          if [ -d ios/App/App.xcworkspace ]; then T="-workspace ios/App/App.xcworkspace"; else T="-project ios/App/App.xcodeproj"; fi
          xcodebuild $T -scheme App -configuration Release -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | tail -40
          mkdir Payload && cp -R build/Build/Products/Release-iphoneos/App.app Payload/ && zip -qry Break-My-Eggs.ipa Payload
      - uses: actions/upload-artifact@v4
        with: { name: Break-My-Eggs-ipa, path: Break-My-Eggs.ipa }
      - name: Attach to the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$(gh release view --repo ${{ github.repository }} --json tagName -q .tagName)" Break-My-Eggs.ipa --clobber --repo ${{ github.repository }}
