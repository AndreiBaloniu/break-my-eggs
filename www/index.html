<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<style>html,body{margin:0;height:100%;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 35%,#ffb02e,#a8520a);
font:bold 22px 'Segoe UI',Arial,sans-serif;color:#fff;text-shadow:0 2px 0 #000}</style></head>
<body>Loading Break My Eggs…<script>
// newest online version if we can reach it, else the copy inside the app
const SITE = "https://andreibaloniu.github.io/break-my-eggs/", APP = "ios", ctl = new AbortController(); setTimeout(() => ctl.abort(), 3500);
fetch(SITE + 'version.json', { cache: 'no-store', signal: ctl.signal })
  .then(r => { if (!r.ok) throw 0; location.replace(SITE + '?app=' + APP); })
  .catch(() => location.replace('game/index.html?app=' + APP + '&site=' + encodeURIComponent(SITE)));
</script></body></html>
